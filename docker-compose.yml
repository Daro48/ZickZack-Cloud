services:
  db:
    image: mysql:8.4
    container_name: cloud_db
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-256M}
      - --innodb-flush-neighbors=0
      - --host-cache-size=0
      - --skip-name-resolve
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-64}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./cloud-backend
    container_name: cloud_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ${MEDIA_HOST_PATH}:/data/media
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      MEDIA_ROOT: /data/media
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      WAITRESS_THREADS: ${WAITRESS_THREADS:-16}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-16}
      SESSION_CACHE_TTL: ${SESSION_CACHE_TTL:-30}
      SESSION_CLEANUP_INTERVAL: ${SESSION_CLEANUP_INTERVAL:-300}
      MEDIA_META_CACHE_MAX: ${MEDIA_META_CACHE_MAX:-50000}
      THUMB_CACHE_MB: ${THUMB_CACHE_MB:-192}
      THUMB_MAX_EDGE: ${THUMB_MAX_EDGE:-512}
      THUMB_QUALITY: ${THUMB_QUALITY:-80}
      ON_DEMAND_THUMB_WORKERS: ${ON_DEMAND_THUMB_WORKERS:-3}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-80000000}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-241591910400}
      VIDEO_THUMB_SEEK: ${VIDEO_THUMB_SEEK:-1}
      VIDEO_THUMB_TIMEOUT: ${VIDEO_THUMB_TIMEOUT:-30}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./cloud-frontend
    container_name: cloud_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cloud_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
