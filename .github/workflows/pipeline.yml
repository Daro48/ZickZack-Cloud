name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-frontend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud-frontend/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-backend/pythoncode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [frontend, backend]
    runs-on: self-hosted
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd /home/daniel/ZickZack-Cloud
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          docker compose up -d --build --remove-orphans backend frontend